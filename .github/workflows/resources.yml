name: Resource foundation
on:
  push:
    paths: ["teams/**", "agents/**", "data/**", "scripts/**", "tests/**", "conftest.py", "compose.yaml", ".env.example", "pyproject.toml", "uv.lock", ".python-version", ".github/workflows/resources.yml"]
  pull_request:
    paths: ["teams/**", "agents/**", "data/**", "scripts/**", "tests/**", "conftest.py", "compose.yaml", ".env.example", "pyproject.toml", "uv.lock", ".python-version", ".github/workflows/resources.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.select.outputs.services }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: select
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: python
        run: |
          import json, os, subprocess
          services = {"docs_tool": "teams/docs/docs_mcp", "requests_tool": "teams/support/requests_mcp",
                      "service_mcp": "teams/backend/service_mcp", "service_api": "teams/backend/service_api",
                      "support_agent": "agents/support_agent", "debug_agent": "agents/debug_agent"}
          base = os.environ.get("BASE", "")
          if not base or set(base) == {"0"}:
              selected = list(services)
          else:
              paths = subprocess.check_output(["git", "diff", "--name-only", base, "HEAD"], text=True).splitlines()
              global_change = any(not any(p.startswith(prefix + "/") for prefix in services.values()) for p in paths)
              selected = list(services) if global_change else [s for s, prefix in services.items() if any(p.startswith(prefix + "/") for p in paths)]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("services=" + json.dumps(selected) + "\n")
  images:
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
      - name: Build affected deployable and check import
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          cp .env.example .env
          docker compose build "$SERVICE"
          case "$SERVICE" in
            docs_tool) package=docs_mcp ;;
            requests_tool) package=requests_mcp ;;
            service_mcp) package=service_mcp ;;
            service_api) package=service_api ;;
            support_agent) package=support_agent ;;
            debug_agent) package=debug_agent ;;
          esac
          docker compose run --rm --no-deps "$SERVICE" /app/.venv/bin/python -c "import ${package}.app"
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.31"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check . && uv run pyright
      - run: cp .env.example .env
      - run: docker compose up --build -d --wait
      - run: uv run pytest --integration -q
      - if: failure()
        run: docker compose logs --no-color --tail=100
      - if: always()
        run: docker compose down -v
