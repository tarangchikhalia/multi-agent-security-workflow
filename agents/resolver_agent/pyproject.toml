[project]
name = "resolver-agent"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "google-adk>=1.39.1,<2",
  # LiteLLM 1.106 imports MCP 2-only types; ADK currently requires MCP 1.x.
  "litellm>=1.105.1,<1.106",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "mcp>=1.26,<2",
  "uvicorn>=0.35,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resolver_agent"]
