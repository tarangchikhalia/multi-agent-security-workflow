[project]
name = "documentation-agent"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "openai>=2,<3",
  "pydantic>=2,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "mcp>=1.26,<2",
  "uvicorn>=0.35,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/documentation_agent"]
