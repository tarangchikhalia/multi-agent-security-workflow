[project]
name = "service-mcp"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = ["mcp>=1.26,<2", "httpx>=0.28,<1", "uvicorn>=0.35,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "pyright>=1.1.400,<2"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/service_mcp"]
