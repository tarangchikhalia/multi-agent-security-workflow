[project]
name = "resource-lab-tests"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "mcp>=1.26,<2",
  "psycopg[binary]>=3.3,<4",
  "pytest>=8,<10",
  "pyright>=1.1.400,<2",
  "ruff>=0.14,<1",
  "google-adk>=1.0,<2",
  "litellm>=1.0,<2",
  "openai>=2,<3",
  "jsonschema>=4,<5",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests", "teams", "agents"]
pythonpath = [".", "teams/docs/docs_mcp/src", "teams/support/requests_mcp/src", "teams/backend/service_mcp/src", "teams/backend/service_api/src", "agents/support_agent/src", "agents/debug_agent/src", "agents/resolver_agent/src"]
markers = ["integration: requires the Compose resource stack"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
include = ["teams", "agents", "scripts", "tests", "conftest.py"]
extraPaths = ["teams/docs/docs_mcp/src", "teams/support/requests_mcp/src", "teams/backend/service_mcp/src", "teams/backend/service_api/src", "agents/support_agent/src", "agents/debug_agent/src", "agents/resolver_agent/src"]
